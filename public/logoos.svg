<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Dark Forest Green Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#0f291e"/>
    </linearGradient>

    <!-- Emerald / Sage Green Fill Gradient -->
    <linearGradient id="letterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c69d"/>
      <stop offset="50%" stop-color="#52b788"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>

    <!-- Warm Accent Ring Gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8f3dc"/>
      <stop offset="100%" stop-color="#b7e4c7"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#05100b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="200" height="200" rx="32" fill="url(#bgGradient)"/>

  <!-- Outer Subtle Ring Glow -->
  <circle cx="100" cy="100" r="64" fill="none" stroke="url(#accentGradient)" stroke-width="1.5" opacity="0.4"/>

  <!-- Main Letter O Path -->
  <path d="
    M 100,35
    C 135,35 160,60 160,100
    C 160,140 135,165 100,165
    C 65,165 40,140 40,100
    C 40,60 65,35 100,35
    Z
    M 100,58
    C 78,58 62,76 62,100
    C 62,124 78,142 100,142
    C 122,142 138,124 138,100
    C 138,76 122,58 100,58
    Z"
    fill="url(#letterGradient)"
    fill-rule="evenodd"
    filter="url(#dropShadow)"
  />
</svg>
